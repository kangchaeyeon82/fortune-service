<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사주 풀이</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="./" class="brand">사주 풀이</a>
    </div>
  </header>

  <main>
    <!-- 입력 -->
    <section id="form-view" class="intro">
      <h1>나의 사주를<br>한눈에 살펴보세요</h1>
      <p class="lead">태어난 날과 시간, 장소로 사주의 구성과 올해 운세, 오늘의 흐름을 풀어 드려요.</p>

      <form id="fortune-form" class="form-card" novalidate>
        <label class="field">
          <span class="label">이름</span>
          <input name="name" maxlength="12" placeholder="최대 12글자 이내로 입력하세요" autocomplete="off">
        </label>

        <fieldset class="field">
          <legend class="label">성별</legend>
          <div class="seg">
            <label><input type="radio" name="gender" value="F" checked><span>여자</span></label>
            <label><input type="radio" name="gender" value="M"><span>남자</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend class="label">생년월일시</legend>
          <div class="birth-row">
            <select name="calendar" aria-label="달력">
              <option value="S">양력</option>
              <option value="M">음력</option>
              <option value="L">음력(윤달)</option>
            </select>
            <input name="birthday" inputmode="numeric" maxlength="10" placeholder="1990/01/01" autocomplete="off" aria-label="생년월일 (숫자 8자리)">
            <input name="birthtime" inputmode="numeric" maxlength="5" placeholder="12:30" autocomplete="off" aria-label="태어난 시각 (숫자 4자리)">
          </div>
          <label class="check"><input type="checkbox" name="unknown_time"><span>시간 모름</span></label>
        </fieldset>

        <div class="field city-field">
          <label class="label" for="city-input">도시</label>
          <input id="city-input" name="city" autocomplete="off" placeholder="태어난 도시를 입력하세요" role="combobox" aria-expanded="false" aria-controls="city-results">
          <ul id="city-results" class="city-results" role="listbox" hidden></ul>
          <p class="hint">태어난 도시를 모르면 ‘서울특별시’ 또는 태어난 나라의 수도를 입력하세요.</p>
          <input type="hidden" name="location_id" value="">
          <input type="hidden" name="location_name" value="">
        </div>

        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn-primary" id="submit-btn">사주 풀이 보기</button>
        <button type="button" class="btn-text" id="sample-btn">예시로 둘러보기</button>
      </form>
    </section>

    <!-- 결과 -->
    <section id="result-view" hidden>
      <div class="result-head">
        <button type="button" class="btn-text back" id="back-btn">다시 입력</button>
        <div id="profile-line"></div>
      </div>
      <nav class="tabs" role="tablist" aria-label="풀이 메뉴">
        <button role="tab" id="tab-chart" aria-controls="panel-chart" aria-selected="true">내 사주</button>
        <button role="tab" id="tab-year" aria-controls="panel-year" aria-selected="false">2026년 운세</button>
        <button role="tab" id="tab-today" aria-controls="panel-today" aria-selected="false">오늘의 운세</button>
      </nav>
      <div id="panel-chart" role="tabpanel" aria-labelledby="tab-chart" class="panel"></div>
      <div id="panel-year" role="tabpanel" aria-labelledby="tab-year" class="panel" hidden></div>
      <div id="panel-today" role="tabpanel" aria-labelledby="tab-today" class="panel" hidden></div>
      <p class="disclaimer">사주 데이터 · 포스텔러 만세력. 풀이는 재미와 참고용이에요.</p>
    </section>
  </main>

  <!-- 탭하면 열리는 해석 시트 -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-grip" aria-hidden="true"></div>
      <h3 id="sheet-title"></h3>
      <div id="sheet-body"></div>
      <button type="button" class="btn-secondary" id="sheet-close">닫기</button>
    </div>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/interpret.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
